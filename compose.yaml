name: twprevbot

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:10.2@sha256:6d44088aa0960bed165259a62b2be8c2521560c81080e133f701f4ba01cfe0d6
    restart: unless-stopped
    environment:
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?TELEGRAM_API_HASH is required}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?TELEGRAM_API_ID is required}
      TELEGRAM_LOCAL: "true"
      TELEGRAM_TEMP_DIR: /tmp/telegram-bot-api
      TELEGRAM_VERBOSITY: "1"
    volumes:
      - ./data/telegram-bot-api:/var/lib/telegram-bot-api
      - ./data/telegram-bot-api-tmp:/tmp/telegram-bot-api

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: twprevbot:local
    restart: unless-stopped
    init: true
    depends_on:
      - telegram-bot-api
    environment:
      BILIBILI_COOKIE_FILE: /run/secrets/bilibili.cookies.txt
      FFMPEG_PATH: /usr/bin/ffmpeg
      TGBOTKEY: ${TGBOTKEY:?TGBOTKEY is required}
      TGBOTNAME: ${TGBOTNAME:?TGBOTNAME is required}
      TELEGRAM_API_ROOT: http://telegram-bot-api:8081
      TELEGRAM_LOCAL_MODE: "true"
      YTDLP_PATH: /usr/local/bin/yt-dlp
    volumes:
      - ./.secrets/bilibili.cookies.txt:/run/secrets/bilibili.cookies.txt:ro
      - ./data/tmp:/tmp
